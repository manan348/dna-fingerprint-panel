[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fingerprint-panel"
version = "1.0.0"
description = "DNA Fingerprint Panel for Varietal Identification - SNP panel design, validation and matching tool"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Abdul Manan", email = "abdul.manan@neurocrop.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-allel>=1.3",
    "pyvcf3>=0.10",
    "pysam>=0.21",
    "primer3-py>=2.0",
    "biopython>=1.81",
    "pyyaml>=6.0",
    "click>=8.1",
    "streamlit>=1.28",
    "plotly>=5.17",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "ortools>=9.7",
    "dask>=2023.10",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.5",
    "pre-commit>=3.5",
    "jupyter>=1.0",
    "ipykernel>=6.25",
]
docs = [
    "sphinx>=7.2",
    "sphinx-rtd-theme>=1.3",
    "myst-parser>=2.0",
]

[project.scripts]
fingerprint = "fingerprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fingerprint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20", "PIE"]
ignore = ["S101", "T201"]

[tool.black]
line-length = 100
target-version = ["py310"]
include = "\\.pyi?$"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true

[tool.coverage.run]
source = ["src/fingerprint"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]